name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (PostgreSQL 15)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Sync dependencies (locked)
        run: uv sync --frozen --group dev

      # The same native, runner-owned Unix-only lab as local verification.
      # Do not point migration/bridge tests at an existing TCP service database.
      - name: Install PostgreSQL 15 binaries
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg /etc/postgresql-common
          sudo curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          # Package installation must not create/start a system TCP cluster.
          echo 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-15
          /usr/lib/postgresql/15/bin/postgres --version

      # First isolate PostgreSQL failures, then run the complete suite.
      # Every invocation creates and stops its own fresh synthetic cluster.
      - name: Run PostgreSQL tests
        run: uv run python tests/baseline/run.py --suite postgres --timeout-seconds 480 --pg-bin /usr/lib/postgresql/15/bin --output "$RUNNER_TEMP/pytest-postgres"

      - name: Run full test suite
        run: uv run python tests/baseline/run.py --suite full --timeout-seconds 900 --pg-bin /usr/lib/postgresql/15/bin --output "$RUNNER_TEMP/pytest-full"

      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-postgresql-evidence
          path: |
            ${{ runner.temp }}/pytest-postgres
            ${{ runner.temp }}/pytest-full
          if-no-files-found: warn
